{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – Amertaka</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <style>
        body { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 480px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .error-code { font-size: 6rem; font-weight: 700; color: #ff6b6b; }
        .btn-primary { background: #4e73df; border-color: #4e73df; }
    </style>
</head>
<body>
    <div class="card p-4 text-center">
        <div class="error-code">404</div>
        <h2 class="mt-3 mb-4">Page Not Found</h2>
        <p class="mb-4">Sorry, the page you are looking for does not exist.</p>
        <a href="{% url 'home' %}" class="btn btn-primary">Go to Home</a>
    </div>
</body>
</html>
