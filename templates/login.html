{% extends "base.html" %}

{% block title %}Login | TakaSave{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 mt-4 mb-5">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; border-radius: 50%; background-color: rgba(79, 70, 229, 0.1);">
                            <i class="bi bi-box-arrow-in-right fs-2 text-primary"></i>
                        </div>
                        <h3 class="card-title fw-bold text-dark">Welcome Back</h3>
                        <p class="text-muted small">Enter your credentials to access your account.</p>
                    </div>


                    <!-- Login Form -->
                    <form method="POST" action="{% url 'login' %}" novalidate>
                        {% csrf_token %}

                        <!-- Email -->
                        <div class="form-floating mb-3">
                            <input 
                                type="email" 
                                class="form-control" 
                                id="email" 
                                name="email"
                                value="{{ request.POST.email }}"
                                placeholder="name@example.com"
                                required
                                autofocus>
                            <label for="email" class="text-muted"><i class="bi bi-envelope me-2"></i>Email address</label>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                name="password"
                                placeholder="Password"
                                required>
                            <label for="password" class="text-muted"><i class="bi bi-shield-lock me-2"></i>Password</label>
                        </div>

                        <!-- Remember Me -->
                        <div class="mb-3 form-check">
                            <input 
                                type="checkbox" 
                                class="form-check-input" 
                                id="remember" 
                                name="remember">
                            <label class="form-check-label fw-semibold" for="remember">
                                Remember me
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4 mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">
                                Login
                            </button>
                        </div>
                    </form>

                    <hr>

                    <div class="text-center small">
                        <a href="{% url 'password_reset_request' %}" class="text-decoration-none fw-semibold">Forgot password?</a>
                        <br>
                        <span>Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Register here</a></span>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">© {{ now.year }} raihanstack. All rights reserved.</p>
        </div>
    </div>
</div>
{% endblock %}
