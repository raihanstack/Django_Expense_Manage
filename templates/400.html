{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Request – TakaSave</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .card { max-width: 480px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 16px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .error-code { font-size: 6rem; font-weight: 700; color: #fd7e14; }
        .btn-primary { background: #4e73df; border-color: #4e73df; border-radius: 50px; padding: 10px 24px; font-weight: 600; }
        .error-icon { font-size: 4rem; color: #fd7e14; }
    </style>
</head>
<body>
    <div class="card p-5 text-center">
        <div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <div class="error-code">400</div>
        <h2 class="mt-2 mb-3">Bad Request</h2>
        <p class="mb-4 text-muted">The server cannot process the request due to something that is perceived to be a client error.</p>
        <a href="{% url 'home' %}" class="btn btn-primary">Go to Home</a>
    </div>
</body>
</html>
