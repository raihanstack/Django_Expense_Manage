{% extends "base.html" %}

{% block title %}Verify Email Change | TakaSave{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 rounded-4 mt-4 mb-5">
        <div class="card-body p-5">
          <h3 class="card-title fw-bold text-center mb-4">Verify Email Change</h3>
          <p class="text-center text-muted mb-4">Enter the 6‑digit OTP sent to your new email address to confirm the change.</p>
          <form method="POST">
            {% csrf_token %}
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="otp" name="otp" placeholder="OTP" required pattern="\d{6}" autocomplete="one-time-code">
              <label for="otp" class="text-muted"><i class="bi bi-key me-2"></i>OTP</label>
            </div>
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">Verify</button>
            </div>
          </form>
          <div class="mt-3 text-center">
            <a href="{% url 'profile_edit_resend' %}" class="text-decoration-none small"><i class="bi bi-arrow-clockwise me-1"></i>Resend OTP</a>
          </div>
          <div class="mt-2 text-center small">
            <a href="{% url 'profile_edit' %}" class="text-muted">Cancel and go back</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
