{% extends "base.html" %}
{% block title %}Edit Profile | TakaSave{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card glass shadow border-0 rounded-4 mt-4 mb-5">
        <div class="card-body p-5">
          <h3 class="card-title fw-bold text-center mb-4">Edit Profile</h3>
          <form method="POST" action="{% url 'profile_edit' %}">
            {% csrf_token %}
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="username" name="username" placeholder="Username" value="{{ form_username|default:user.username }}" required>
              <label for="username" class="text-muted"><i class="bi bi-person me-2"></i>Username</label>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" name="email" placeholder="Email" value="{{ form_email|default:user.email }}" required>
              <label for="email" class="text-muted"><i class="bi bi-envelope me-2"></i>Email</label>
            </div>
            <div class="form-floating mb-3 position-relative">
              <input type="password" class="form-control" id="password1" name="password1" placeholder="New Password">
              <label for="password1" class="text-muted"><i class="bi bi-shield-lock me-2"></i>New Password (optional)</label>
              <button type="button" class="btn btn-outline-secondary btn-sm position-absolute top-50 end-0 translate-middle-y me-2" onclick="togglePassword('password1', this)"><i class="bi bi-eye"></i></button>
            </div>
            <div class="form-floating mb-4 position-relative">
              <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm Password">
              <label for="password2" class="text-muted"><i class="bi bi-shield-lock me-2"></i>Confirm Password (optional)</label>
              <button type="button" class="btn btn-outline-secondary btn-sm position-absolute top-50 end-0 translate-middle-y me-2" onclick="togglePassword('password2', this)"><i class="bi bi-eye"></i></button>
            </div>
            <div class="d-grid mt-4 mb-3">
              <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">Save Change</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
function togglePassword(fieldId, btn) {
  const field = document.getElementById(fieldId);
  if (!field) return;
  const icon = btn.querySelector('i');
  if (field.type === 'password') {
    field.type = 'text';
    if (icon) icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    field.type = 'password';
    if (icon) icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
}
</script>
{% endblock %}
