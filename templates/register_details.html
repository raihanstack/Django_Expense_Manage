{% extends "base.html" %}

{% block title %}Account Details | TakaSave{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 mt-4 mb-5">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; border-radius: 50%; background-color: rgba(16, 185, 129, 0.1);">
                            <i class="bi bi-person-check fs-2 text-success"></i>
                        </div>
                        <h3 class="card-title fw-bold text-dark">Account Details</h3>
                        <p class="text-muted small">Step 3 of 3: Set Credentials</p>
                        <p class="text-center text-muted mb-2">Configure credentials for verified email:<br><strong class="text-success">{{ email }}</strong></p>
                    </div>

                    <!-- Step 3: Registration details form -->
                    <form method="POST" action="{% url 'register_details' %}" novalidate>
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="form-floating mb-3">
                            <input 
                                type="text" 
                                class="form-control rounded-3" 
                                id="username" 
                                name="username" 
                                placeholder="Username" 
                                value="{{ request.POST.username }}" 
                                required
                                autofocus>
                            <label for="username" class="text-muted"><i class="bi bi-person me-2"></i>Choose Username</label>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input 
                                type="password" 
                                class="form-control rounded-3" 
                                id="password1" 
                                name="password1" 
                                placeholder="Password" 
                                required>
                            <label for="password1" class="text-muted"><i class="bi bi-shield-lock me-2"></i>Create Password</label>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-floating mb-4">
                            <input 
                                type="password" 
                                class="form-control rounded-3" 
                                id="password2" 
                                name="password2" 
                                placeholder="Confirm Password" 
                                required>
                            <label for="password2" class="text-muted"><i class="bi bi-shield-check me-2"></i>Confirm Password</label>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid mt-4 mb-3">
                            <button type="submit" class="btn btn-success btn-lg fw-bold rounded-pill hover-lift shadow-sm text-white">
                                Complete Registration <i class="bi bi-check-circle ms-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">© {% now "Y" %} raihanstack. All rights reserved.</p>
        </div>
    </div>
</div>
{% endblock %}
