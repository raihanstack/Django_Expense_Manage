{% extends "base.html" %}

{% block title %}{% if expense %}Update Expense{% else %}Add New Expense{% endif %} | TakaSave{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 mt-3 mb-5">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4 fw-bold text-dark">
                    {% if expense %}Update Expense{% else %}Add New Expense{% endif %}
                </h3>

                <form method="POST" class="mt-4" novalidate>
                    {% csrf_token %}

                    <!-- Title -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="title" name="title" 
                               placeholder="Expense title" 
                               value="{% if expense %}{{ expense.title }}{% endif %}" required>
                        <label for="title" class="text-muted"><i class="bi bi-tag me-2"></i>Title</label>
                    </div>

                    <!-- Amount -->
                    <div class="form-floating mb-3">
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" 
                               placeholder="0.00" 
                               value="{% if expense %}{{ expense.amount }}{% endif %}" required>
                        <label for="amount" class="text-muted"><i class="bi bi-currency-dollar me-2"></i>Amount (৳)</label>
                    </div>

                    <!-- Category -->
                    <div class="form-floating mb-3">
                        <select class="form-select" id="category" name="category" required>
                            <option value="">Select Category</option>
                            {% for item in categories %}
                                <option value="{{ item.id }}"
                                    {% if expense and expense.category.id == item.id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ item.name }}
                                </option>
                            {% endfor %}
                        </select>
                        <label for="category" class="text-muted"><i class="bi bi-folder2 me-2"></i>Category</label>
                    </div>

                    <!-- Wallet -->
                    <div class="form-floating mb-3">
                        <select class="form-select" id="wallet" name="wallet" required>
                            <option value="">Select Wallet</option>
                            {% for item in wallets %}
                                <option value="{{ item.id }}"
                                    {% if expense and expense.wallet.id == item.id %}
                                        selected
                                    {% elif not expense and forloop.first %}
                                        selected
                                    {% endif %}
                                >
                                    {{ item.name }} (৳ {{ item.balance|floatformat:2 }})
                                </option>
                            {% endfor %}
                        </select>
                        <label for="wallet" class="text-muted"><i class="bi bi-credit-card me-2"></i>Wallet</label>
                    </div>


                    <!-- Date -->
                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="date" name="date" 
                               value="{% if expense %}{{ expense.date|date:'Y-m-d' }}{% else %}{{ today_date }}{% endif %}" required>
                        <label for="date" class="text-muted"><i class="bi bi-calendar-event me-2"></i>Date</label>
                    </div>

                    <!-- Description -->
                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="description" name="description" placeholder="Description" style="height: 100px">{% if expense %}{{ expense.description }}{% endif %}</textarea>
                        <label for="description" class="text-muted"><i class="bi bi-card-text me-2"></i>Description</label>
                    </div>

                    <!-- Submit button -->
                    <div class="d-grid mt-4 mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill hover-lift shadow-sm">
                            {% if expense %}Update{% else %}Save{% endif %} Expense
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="{% url 'expense_list' %}" class="text-decoration-none fw-semibold">Back to Expenses</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
